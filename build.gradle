import net.darkhax.curseforgegradle.*

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.14,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'net.darkhax.curseforgegradle' version "${cursegradle_version}"
}

version = mod_version
group = mod_group_id
base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: "$mapping_version-$minecraft_version"
    copyIdeResources = true

    //accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run/client')
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'blockychef'
            properties 'mixin.env.remapRefMap': 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"

            arg "-mixin.config=blockychef.mixins.json"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run/server')
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'blockychef'
            properties 'mixin.env.remapRefMap': 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"

            arg "-mixin.config=blockychef.mixins.json"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url 'https://www.cursemaven.com' }
    maven { url "https://maven.ryanliptak.com/" }
    maven { url "https://maven.blamejared.com/" }
    maven { url "https://modmaven.dev" }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Configuration
    implementation fg.deobf("curse.maven:configuration-444699:${configuration_version}")
    // Mixin
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // Appleskin
    implementation fg.deobf("squeek.appleskin:appleskin-forge:${appleskin_version}")
    // Waila
    implementation fg.deobf("curse.maven:jade-324717:${jade_version}")
    // JEI
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"))
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"))
    runtimeOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}"))
}

def resourceTargets = ['META-INF/mods.toml', 'pack.mcmeta']
def replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        forge_version: forge_version, forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description
]
processResources {
    inputs.properties replaceProperties
    replaceProperties.put 'project', project

    filesMatching(resourceTargets) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs": "blockychef.mixins.json"
        ])
    }
}

mixin {
    add sourceSets.main, "blockychef.refmap.json"
}

jar.finalizedBy('reobfJar')

tasks.register('releaseMod', TaskPublishCurseForge).configure {
    group = 'publishing'
    apiToken = project.hasProperty("CURSEFORGE_TOKEN") ? project.findProperty("CURSEFORGE_TOKEN") : ""
    debugMode = debug.toBoolean()

    def buildFile = upload(project_id, tasks.jar.archiveFile)
    buildFile.releaseType = Constants.RELEASE_TYPE_RELEASE
    buildFile.changelogType = Constants.CHANGELOG_MARKDOWN
    buildFile.changelog = file("./CHANGELOG.md").exists() ? file("./CHANGELOG.md").text : "-- No changelog provided --"
    buildFile.displayName = "${mod_id}-${minecraft_version}-${mod_version}"
    buildFile.addModLoader("Forge", "NeoForge")
    buildFile.addJavaVersion("Java 17")
    buildFile.addRequirement("configuration")
    buildFile.addGameVersion(minecraft_version)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
